[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"

[dependencies]
yew = { version = "0.23.0", features = [ "csr" ] }
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Storage", "MediaQueryList", "HtmlElement"] }
js-sys = "0.3.106"
yew-router = "0.20"
tokio = { version = "1", features = ["rt"], optional = true }

[features]
ssr = ["yew/ssr", "dep:tokio"]

[[bin]]
name = "prerender"
required-features = ["ssr"]

[build-dependencies]
gray_matter = "0.3"
mermaid-rs-renderer = { version = "0.3", default-features = false }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
